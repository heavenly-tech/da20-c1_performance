name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cache trunk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-v1
      - name: fmt
        run: cargo fmt --all -- --check
      - name: install trunk
        run: |
          if [ ! -x "$HOME/.cargo/bin/trunk" ]; then
            cargo install trunk --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: wasm build
        working-directory: crates/da20-ui
        run: trunk build --release
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build server
        run: cargo build --release -p da20-server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (linux/amd64 and linux/arm64)
        run: docker buildx build --platform linux/amd64,linux/arm64 --progress=plain .
