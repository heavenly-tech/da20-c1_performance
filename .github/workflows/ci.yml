name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cache trunk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cache/trunk
          key: trunk-${{ runner.os }}-v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: wasm-bindgen-cli pin matches Cargo.lock
        run: bash scripts/check-wasm-bindgen-pin.sh
      - name: install trunk
        run: |
          if [ ! -x "$HOME/.cargo/bin/trunk" ]; then
            cargo install trunk --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: wasm build
        working-directory: crates/da20-ui
        run: |
          set -eu
          for attempt in 1 2 3; do
            if trunk build --release; then
              exit 0
            fi
            echo "trunk build failed (attempt ${attempt}/3), retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          exit 1
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build server
        run: cargo build --release -p da20-server

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: wasm-bindgen-cli pin matches Cargo.lock
        run: bash scripts/check-wasm-bindgen-pin.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build image (linux/amd64 and linux/arm64)
        run: docker buildx build --platform linux/amd64,linux/arm64 --progress=plain .
