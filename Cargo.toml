[workspace]
resolver = "2"
members = [
    "crates/da20-core",
    "crates/da20-ui",
    "crates/da20-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["cloud-agent <noreply@heavenly.local>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
